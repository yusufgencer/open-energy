[project]
name = "openenergy"
version = "0.1.0"
description = "Wind & solar power forecasting platform"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3,<4",
    "duckdb>=1.1",
    "polars>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pvlib>=0.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: canlı Open-Meteo API çağrısı yapar (default kapalı)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openenergy"]
